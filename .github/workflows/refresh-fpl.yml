name: Refresh Play sports data

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore last successful API snapshots
        uses: actions/cache@v4
        with:
          path: .cache/play
          key: play-data-${{ github.run_id }}
          restore-keys: play-data-
      - name: Install dependencies
        run: npm ci
      - name: Check sports logic
        run: node scripts/test-play.mjs
      - name: Refresh and build all pages
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish refreshed snapshot
        id: deployment
        uses: actions/deploy-pages@v4
